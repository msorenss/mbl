[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
# Internal crates
mbl-core = { path = "crates/mbl-core" }
mbl-db = { path = "crates/mbl-db" }
mbl-service = { path = "crates/mbl-service" }
mbl-api = { path = "crates/mbl-api" }
mbl-auth = { path = "crates/mbl-auth" }
mbl-parser = { path = "crates/mbl-parser" }
mbl-probe = { path = "crates/mbl-probe" }
mbl-scanner = { path = "crates/mbl-scanner" }
mbl-metadata = { path = "crates/mbl-metadata" }
mbl-images = { path = "crates/mbl-images" }
mbl-jobs = { path = "crates/mbl-jobs" }
mbl-playback = { path = "crates/mbl-playback" }
mbl-transcode = { path = "crates/mbl-transcode" }
mbl-stream = { path = "crates/mbl-stream" }
mbl-platform = { path = "crates/mbl-platform" }
mbl-hwaccel = { path = "crates/mbl-hwaccel" }
mbl-mcp = { path = "crates/mbl-mcp" }
mbl-ui-kit = { path = "crates/mbl-ui-kit" }
mbl-analysis = { path = "crates/mbl-analysis" }
mbl-hailo = { path = "crates/mbl-hailo" }
mbl-tv = { path = "crates/mbl-tv" }
mbl-remote = { path = "crates/mbl-remote" }

# External crates (approved list: IMPLEMENTATION.md §1.4)
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
blurhash = "0.2.3"
camino = { version = "1.2.6", features = ["serde1"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dunce = "1.0.5"
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
governor = "0.10.4"
hmac = "0.13.0"
http-body-util = "0.1"
ignore = "0.4.33"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
insta = "1.49.0"
notify = "8.2.0"
proptest = "1.12.0"
quick-xml = { version = "0.42.0", features = ["serialize"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "http2", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
strsim = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "macros",
    "migrate",
    "derive",
] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.8"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "net",
    "sync",
    "time",
    "process",
    "io-util",
    "io-std",
] }
tower = { version = "0.5.3", features = ["util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tokio-tungstenite = "0.30.0"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
utoipa = "6.0.0"
wiremock = "0.6.5"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
mime_guess = "2.0.5"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
