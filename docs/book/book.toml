[book]
authors = ["Marcus Sörensen", "MBL Contributors"]
language = "en"
multilingual = false
src = "src"
title = "MBL — Modern Personal Media Server"

[output.html]
git-repository-url = "https://github.com/msorenss/mbl"
edit-url-template = "https://github.com/msorenss/mbl/edit/main/docs/book/{path}"
default-theme = "rust"
preferred-dark-theme = "coal"
mathjax-support = false
copy-js = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
