[package]
name = "mbl-server"
description = "MBL media server binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
camino.workspace = true
clap.workspace = true
figment.workspace = true
mbl-api.workspace = true
mbl-core.workspace = true
mbl-db.workspace = true
mbl-images.workspace = true
mbl-jobs.workspace = true
mbl-mcp.workspace = true
mbl-metadata.workspace = true
mbl-platform.workspace = true
mbl-probe.workspace = true
mbl-scanner.workspace = true
mbl-service.workspace = true
mbl-stream.workspace = true
mbl-transcode.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
mime_guess.workspace = true
rust-embed.workspace = true

[dev-dependencies]
async-trait.workspace = true
dunce.workspace = true
