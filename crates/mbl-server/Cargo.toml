futures-util.workspace = true
http-body-util.workspace = true
image.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "mbl"
maintainer = "MBL Contributors <dev@mbl.media>"
copyright = "2026 MBL contributors"
license-file = ["../../LICENSE", "4"]
depends = "$auto, ffmpeg"
section = "video"
priority = "optional"
extended-description = """\
MBL is a fast, lightweight media server built for Raspberry Pi 5 and personal home servers. \
Features direct play, HLS streaming with hardware acceleration, audio transcode, embedded web client, \
and Model Context Protocol (MCP) support."""
maintainer-scripts = "../../packaging/deb"
assets = [
    ["target/release/mbl-server", "usr/bin/mbl-server", "755"],
    ["../../packaging/systemd/mbl.service", "lib/systemd/system/mbl.service", "644"],
]
