[package]
name = "mbl-node"
description = "MBL Federated Storage Node daemon and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
mbl-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "mbl-node"
maintainer = "MBL Contributors <dev@mbl.media>"
copyright = "2026 MBL contributors"
license-file = ["../../LICENSE", "4"]
depends = "$auto"
section = "video"
priority = "optional"
extended-description = """\
MBL Federated Storage Node daemon indexing local storage and federating media libraries \
with a central MBL media server."""
assets = [
    ["target/release/mbl-node", "usr/bin/mbl-node", "755"],
    ["../../packaging/systemd/mbl-node.service", "lib/systemd/system/mbl-node.service", "644"],
]
