name = "chrome"
max_audio_channels = 6

[[direct_play]]
containers = ["mp4", "mov", "m4a", "m4v"]
video_codecs = ["h264", "hevc", "vp9", "av1"]
audio_codecs = ["aac", "mp3", "opus", "flac"]

[[direct_play]]
containers = ["webm"]
video_codecs = ["vp8", "vp9", "av1"]
audio_codecs = ["opus", "vorbis"]

[[direct_play]]
containers = ["mp3", "flac", "ogg", "wav", "aac"]
video_codecs = []
audio_codecs = ["mp3", "flac", "opus", "vorbis", "pcm_s16le", "aac"]

[[codec_limits]]
codec = "h264"
profiles = ["Baseline", "Constrained Baseline", "Main", "High"]
max_level = 52
max_width = 3840
max_height = 2160
max_bit_depth = 8
hdr = false

[[codec_limits]]
codec = "hevc"
profiles = ["Main", "Main 10"]
max_level = 153
max_width = 3840
max_height = 2160
max_bit_depth = 10
hdr = true
hdr_formats = ["hdr10", "hlg"]

[[codec_limits]]
codec = "vp8"
max_width = 3840
max_height = 2160
max_bit_depth = 8
hdr = false

[[codec_limits]]
codec = "vp9"
profiles = ["Profile 0", "Profile 2"]
max_width = 3840
max_height = 2160
max_bit_depth = 10
hdr = true
hdr_formats = ["hdr10", "hlg"]

[[codec_limits]]
codec = "av1"
profiles = ["Main"]
max_level = 13
max_width = 3840
max_height = 2160
max_bit_depth = 10
hdr = true
hdr_formats = ["hdr10", "hlg"]

[transcode_target]
container = "fmp4"
video_codecs = ["h264", "hevc", "vp9", "av1"]
audio_codecs = ["aac", "opus", "mp3"]

