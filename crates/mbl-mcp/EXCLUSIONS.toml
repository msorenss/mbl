# MCP Tool Parity Exclusions (IMPLEMENTATION.md §0.1 Rule 13)
#
# Endpoints listed here are binary media streams, interactive browser/TV auth handshakes,
# or MCP security administration endpoints intentionally not exposed as MCP tools.

[[exclusions]]
path = "/api/v1/stream/direct/{partId}"
reason = "Binary media byte-range stream for video/audio players."

[[exclusions]]
path = "/api/v1/stream/hls/{session}/master.m3u8"
reason = "HLS playback manifest consumed by video players."

[[exclusions]]
path = "/api/v1/stream/hls/{session}/{rendition}/{file}"
reason = "Binary fMP4 HLS segments consumed by video players."

[[exclusions]]
path = "/api/v1/stream/subtitles/{partId}/{file}"
reason = "WebVTT / ASS subtitle stream consumed by video players."

[[exclusions]]
path = "/api/v1/stream/trickplay/{partId}/index.json"
reason = "Player scrubber sprite-sheet index."

[[exclusions]]
path = "/api/v1/stream/trickplay/{partId}/{sprite}"
reason = "Binary JPEG sprite sheet for player timeline scrubbing."

[[exclusions]]
path = "/api/v1/auth/quick-connect"
reason = "Interactive 6-digit TV pairing flow."

[[exclusions]]
path = "/api/v1/auth/quick-connect/authorize"
reason = "Interactive 6-digit TV pairing authorization."

[[exclusions]]
path = "/api/v1/auth/quick-connect/poll"
reason = "Interactive 6-digit TV pairing poll."

[[exclusions]]
path = "/api/v1/mcp/status"
reason = "MCP security kill-switch cannot be modified over MCP (PLAN §9.5.3)."

[[exclusions]]
path = "/.well-known/oauth-authorization-server"
reason = "OAuth 2.1 Authorization Server Metadata discovery."

[[exclusions]]
path = "/.well-known/oauth-protected-resource"
reason = "OAuth 2.1 Protected Resource Metadata discovery."

[[exclusions]]
path = "/oauth/register"
reason = "OAuth 2.1 dynamic client registration protocol handshake."

[[exclusions]]
path = "/oauth/authorize"
reason = "OAuth 2.1 browser user authorization and consent redirect."

[[exclusions]]
path = "/oauth/token"
reason = "OAuth 2.1 token issuance and refresh rotation endpoint."

[[exclusions]]
path = "/oauth/revoke"
reason = "OAuth 2.1 token revocation endpoint."

[[exclusions]]
path = "/api/v1/auth/totp/setup"
reason = "Interactive 2FA setup with QR code and secret generation."

[[exclusions]]
path = "/api/v1/auth/totp/verify"
reason = "Interactive 2FA verification challenge."

[[exclusions]]
path = "/api/v1/auth/totp/disable"
reason = "Interactive 2FA disablement."

[[exclusions]]
path = "/api/v1/auth/register-invite"
reason = "Public user registration via invite code."

[[exclusions]]
path = "/api/v1/auth/tailscale"
reason = "Interactive Tailscale identity authentication flow."

[[exclusions]]
path = "/api/v1/invites/inspect/{code}"
reason = "Public pre-registration invite inspection."

[[exclusions]]
path = "/api/v1/users/{id}/pin"
reason = "Interactive profile numeric PIN setup."

[[exclusions]]
path = "/api/v1/users/{id}/pin/verify"
reason = "Interactive profile numeric PIN verification challenge."
