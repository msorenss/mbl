# MCP Tool Parity Exclusions (IMPLEMENTATION.md §0.1 Rule 13)
#
# Endpoints listed here are binary media streams, interactive browser/TV auth handshakes,
# or MCP security administration endpoints intentionally not exposed as MCP tools.

[[exclusions]]
path = "/api/v1/stream/direct/{partId}"
reason = "Binary media byte-range stream for video/audio players."

[[exclusions]]
path = "/api/v1/stream/hls/{session}/master.m3u8"
reason = "HLS playback manifest consumed by video players."

[[exclusions]]
path = "/api/v1/stream/hls/{session}/{rendition}/{file}"
reason = "Binary fMP4 HLS segments consumed by video players."

[[exclusions]]
path = "/api/v1/stream/subtitles/{partId}/{target}"
reason = "WebVTT / ASS subtitle stream consumed by video players."

[[exclusions]]
path = "/api/v1/stream/trickplay/{partId}/index.json"
reason = "Player scrubber sprite-sheet index and idle-generation pending status; binary presentation cache, not an agent workflow."

[[exclusions]]
path = "/api/v1/stream/trickplay/{partId}/{sprite}"
reason = "Binary JPEG sprite sheet for player timeline scrubbing."

[[exclusions]]
path = "/api/v1/auth/quick-connect"
reason = "Interactive 6-digit TV pairing flow."

[[exclusions]]
path = "/api/v1/auth/quick-connect/authorize"
reason = "Interactive 6-digit TV pairing authorization."

[[exclusions]]
path = "/api/v1/auth/quick-connect/poll"
reason = "Interactive 6-digit TV pairing poll."

[[exclusions]]
path = "/api/v1/mcp/status"
reason = "MCP security kill-switch cannot be modified over MCP (PLAN §9.5.3)."

[[exclusions]]
path = "/.well-known/oauth-authorization-server"
reason = "OAuth 2.1 Authorization Server Metadata discovery."

[[exclusions]]
path = "/.well-known/oauth-protected-resource"
reason = "OAuth 2.1 Protected Resource Metadata discovery."

[[exclusions]]
path = "/oauth/register"
reason = "OAuth 2.1 dynamic client registration protocol handshake."

[[exclusions]]
path = "/oauth/authorize"
reason = "OAuth 2.1 browser user authorization and consent redirect."

[[exclusions]]
path = "/oauth/token"
reason = "OAuth 2.1 token issuance and refresh rotation endpoint."

[[exclusions]]
path = "/oauth/revoke"
reason = "OAuth 2.1 token revocation endpoint."

[[exclusions]]
path = "/api/v1/auth/totp/setup"
reason = "Interactive 2FA setup with QR code and secret generation."

[[exclusions]]
path = "/api/v1/auth/totp/verify"
reason = "Interactive 2FA verification challenge."

[[exclusions]]
path = "/api/v1/auth/totp/disable"
reason = "Interactive 2FA disablement."

[[exclusions]]
path = "/api/v1/auth/register-invite"
reason = "Public user registration via invite code."

[[exclusions]]
path = "/api/v1/auth/tailscale"
reason = "Interactive Tailscale identity authentication flow."

[[exclusions]]
path = "/api/v1/invites/inspect/{code}"
reason = "Public pre-registration invite inspection."

[[exclusions]]
path = "/api/v1/users/{id}/pin"
reason = "Interactive profile numeric PIN setup."

[[exclusions]]
path = "/api/v1/users/{id}/pin/verify"
reason = "Interactive profile numeric PIN verification challenge."

[[exclusions]]
path = "/api/v1/stream/audio/{partId}"
reason = "Binary progressive audio stream for music/audio playback."

[[exclusions]]
path = "/api/v1/events"
reason = "WebSocket real-time event bus stream."

[[exclusions]]
path = "/api/v1/companion/ws/{sessionId}"
reason = "WebSocket real-time companion co-watching stream."

[[exclusions]]
path = "/api/v1/matchmaker/sessions"
reason = "Interactive mobile swipe-to-match session initialization."

[[exclusions]]
path = "/api/v1/matchmaker/sessions/{id}"
reason = "Interactive mobile swipe-to-match session inspection."

[[exclusions]]
path = "/api/v1/matchmaker/sessions/{id}/vote"
reason = "Interactive user swipe voting endpoint."

[[exclusions]]
path = "/api/v1/matchmaker/sessions/{id}/ws"
reason = "WebSocket real-time match announcement and sync."

[[exclusions]]
path = "/api/v1/images/{id}"
reason = "Binary image asset serving endpoint."

[[exclusions]]
path = "/api/v1/libraries/{id}/timeline"
reason = "Photo gallery date timeline histogram."

[[exclusions]]
path = "/api/v1/auth/login"
reason = "Interactive browser login session creation."

[[exclusions]]
path = "/api/v1/auth/logout"
reason = "Interactive browser session termination."

[[exclusions]]
path = "/api/v1/auth/me"
reason = "Current authenticated web session caller info."

[[exclusions]]
path = "/api/v1/auth/sessions"
reason = "Web session cookie listing."

[[exclusions]]
path = "/api/v1/auth/sessions/{id}"
reason = "Web session cookie revocation."

[[exclusions]]
path = "/api/v1/auth/tokens"
reason = "API token issuance (use admin UI or OAuth)."

[[exclusions]]
path = "/api/v1/auth/tokens/{id}"
reason = "API token deletion."

[[exclusions]]
path = "/api/v1/stream/worker/source/{partId}"
reason = "Binary media byte-range stream for transcode workers."

[[exclusions]]
path = "/api/v1/stream/hls/{sessionId}/segments/{filename}"
reason = "Binary segment PUT upload for transcode workers."

[[exclusions]]
path = "/api/v1/workers/heartbeat"
reason = "Transcode worker daemon heartbeat telemetry."

[[exclusions]]
path = "/api/v1/nodes/{id}/sync-catalog"
reason = "Remote storage node daemon delta catalog sync."

[[exclusions]]
path = "/api/v1/nodes/{id}/stream/handover/{itemId}"
reason = "Player direct LAN streaming handover evaluation."

[[exclusions]]
path = "/api/v1/players/{id}"
reason = "Client presence unregistration on Cast/native player disconnect; lifecycle cleanup performed by the owning client."

[[exclusions]]
path = "/api/v1/players/{id}/connect"
reason = "Session-bound WebSocket command transport for registered players; MCP sends commands using the command endpoint."

[[exclusions]]
path = "/api/v1/matchmaker/sessions/{id}/join"
reason = "Explicit authenticated lobby invitation redemption; MCP does not join a user's social session on their behalf."

[[exclusions]]
path = "/api/v1/libraries/{id}/photos"
reason = "Specialized date-grouped gallery pagination; media discovery and item details remain available through existing library tools."

[[exclusions]]
path = "/api/v1/stream/live/{session}/{file}"
reason = "Binary live HLS/fMP4 capability URL; lease creation and renewal remain authenticated player operations."

[[exclusions]]
path = "/api/v1/livetv/stream/{channelId}"
reason = "Interactive player lease creation/renewal bound to the authenticated login session; guide and DVR are available through MCP."

[[exclusions]]
path = "/api/v1/livetv/stream/{channelId}/release"
reason = "Interactive player cleanup of an owned live-stream lease."
