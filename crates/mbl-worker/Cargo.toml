[package]
name = "mbl-worker"
description = "MBL Distributed Transcode Worker daemon and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
mbl-core.workspace = true
mbl-hwaccel.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "mbl-worker"
maintainer = "MBL Contributors <dev@mbl.media>"
copyright = "2026 MBL contributors"
license-file = ["../../LICENSE", "4"]
depends = "$auto, ffmpeg"
section = "video"
priority = "optional"
extended-description = """\
MBL Distributed Transcode Worker daemon offloading heavy transcoding and batch jobs \
from the primary MBL media server."""
assets = [
    ["target/release/mbl-worker", "usr/bin/mbl-worker", "755"],
    ["../../packaging/systemd/mbl-worker.service", "lib/systemd/system/mbl-worker.service", "644"],
]
