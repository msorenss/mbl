name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  build-deb-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo build --release -p mbl-worker -p mbl-node
      - run: cargo deb -p mbl-server
      - name: Verify Debian binaries
        run: dpkg-deb --fsys-tarfile target/debian/*.deb | tar -tf - ./usr/bin/mbl-server ./usr/bin/mbl-worker ./usr/bin/mbl-node
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-deb-x86_64
          path: target/debian/*.deb

  build-deb-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo build --release -p mbl-worker -p mbl-node
      - run: cargo deb -p mbl-server
      - name: Verify Debian binaries
        run: dpkg-deb --fsys-tarfile target/debian/*.deb | tar -tf - ./usr/bin/mbl-server ./usr/bin/mbl-worker ./usr/bin/mbl-node
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-deb-arm64
          path: target/debian/*.deb

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mbl-server -p mbl-tv -p mbl-worker -p mbl-node
      - name: Build MSI Installer and Package Windows Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item packaging\windows\README.txt staging\
          $rawTag = "${{ github.ref_name }}"
          if (-not $rawTag) { $rawTag = "v0.8.0" }
          $version = $rawTag.TrimStart('v')

          # Build MSI
          & .\packaging\windows\build-msi.ps1 -Version "$version" -OutputDir "staging"

          # Copy out MSI
          Copy-Item "staging\mbl-$version-windows-x86_64.msi" "dist-windows.msi"

          # Package ZIP
          $zipName = "mbl-$rawTag-windows-x86_64.zip"
          $zipFiles = @(
            "staging\mbl-server.exe",
            "staging\mbl-tv.exe",
            "staging\mbl-worker.exe",
            "staging\mbl-node.exe",
            "staging\README.txt"
          )
          Compress-Archive -Path $zipFiles -DestinationPath $zipName
          Move-Item $zipName dist-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-windows-x86_64
          path: |
            dist-windows.zip
            dist-windows.msi

  create-release:
    needs: [build-deb-linux-x86_64, build-deb-linux-arm64, build-windows-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Rename Windows artifacts if needed
        run: |
          cd release-dist
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="v0.8.0"
          VER="${TAG#v}"
          if [ -f dist-windows.zip ]; then
            mv dist-windows.zip "mbl-${TAG}-windows-x86_64.zip"
          fi
          if [ -f dist-windows.msi ]; then
            mv dist-windows.msi "mbl-${VER}-windows-x86_64.msi"
          fi
      - name: Generate SHA-256 Checksums
        working-directory: release-dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-dist/*
