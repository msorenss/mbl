name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUSTFLAGS: "-D warnings"

jobs:
  build-deb-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo build --release -p mbl-worker -p mbl-node
      - run: cargo deb -p mbl-server
      - run: cargo deb -p mbl-worker
      - run: cargo deb -p mbl-node
      - name: Package standalone Linux x86_64 tarballs
        run: |
          tar -czvf target/debian/mbl-worker-linux-x86_64.tar.gz -C target/release mbl-worker
          tar -czvf target/debian/mbl-node-linux-x86_64.tar.gz -C target/release mbl-node
      - name: Verify Debian binaries
        run: |
          dpkg-deb --fsys-tarfile target/debian/mbl_*.deb | tar -tf - ./usr/bin/mbl-server
          dpkg-deb --fsys-tarfile target/debian/mbl-worker_*.deb | tar -tf - ./usr/bin/mbl-worker
          dpkg-deb --fsys-tarfile target/debian/mbl-node_*.deb | tar -tf - ./usr/bin/mbl-node
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-linux-x86_64
          path: |
            target/debian/*.deb
            target/debian/*.tar.gz

  build-deb-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo build --release -p mbl-worker -p mbl-node
      - run: cargo deb -p mbl-server
      - run: cargo deb -p mbl-worker
      - run: cargo deb -p mbl-node
      - name: Package standalone Linux arm64 tarballs
        run: |
          tar -czvf target/debian/mbl-worker-linux-arm64.tar.gz -C target/release mbl-worker
          tar -czvf target/debian/mbl-node-linux-arm64.tar.gz -C target/release mbl-node
      - name: Verify Debian binaries
        run: |
          dpkg-deb --fsys-tarfile target/debian/mbl_*.deb | tar -tf - ./usr/bin/mbl-server
          dpkg-deb --fsys-tarfile target/debian/mbl-worker_*.deb | tar -tf - ./usr/bin/mbl-worker
          dpkg-deb --fsys-tarfile target/debian/mbl-node_*.deb | tar -tf - ./usr/bin/mbl-node
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-linux-arm64
          path: |
            target/debian/*.deb
            target/debian/*.tar.gz

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mbl-server -p mbl-tv -p mbl-worker -p mbl-node
      - name: Build MSI Installer and Package Windows Zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item packaging\windows\README.txt staging\
          $rawTag = "${{ github.ref_name }}"
          if (-not $rawTag) { $rawTag = "v1.1.0" }
          $version = $rawTag.TrimStart('v')

          # Build MSI
          & .\packaging\windows\build-msi.ps1 -Version "$version" -OutputDir "staging"

          # Copy out MSI
          Copy-Item "staging\mbl-$version-windows-x86_64.msi" "dist-windows.msi"

          # Package Full Server ZIP
          $zipName = "mbl-$rawTag-windows-x86_64.zip"
          $zipFiles = @(
            "staging\mbl-server.exe",
            "staging\mbl-tv.exe",
            "staging\mbl-worker.exe",
            "staging\mbl-node.exe",
            "staging\README.txt"
          )
          Compress-Archive -Path $zipFiles -DestinationPath $zipName
          Move-Item $zipName dist-windows.zip

          # Package Standalone Worker ZIP
          $workerFiles = @(
            "staging\mbl-worker.exe",
            "packaging\windows\README-worker.txt"
          )
          Compress-Archive -Path $workerFiles -DestinationPath dist-worker-windows.zip

          # Package Standalone Node ZIP
          $nodeFiles = @(
            "staging\mbl-node.exe",
            "packaging\windows\README-node.txt"
          )
          Compress-Archive -Path $nodeFiles -DestinationPath dist-node-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-windows-x86_64
          path: |
            dist-windows.zip
            dist-windows.msi
            dist-worker-windows.zip
            dist-node-windows.zip

  create-release:
    needs: [build-deb-linux-x86_64, build-deb-linux-arm64, build-windows-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Rename release artifacts if needed
        run: |
          cd release-dist
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="v1.1.0"
          VER="${TAG#v}"
          if [ -f dist-windows.zip ]; then
            mv dist-windows.zip "mbl-${TAG}-windows-x86_64.zip"
          fi
          if [ -f dist-windows.msi ]; then
            mv dist-windows.msi "mbl-${VER}-windows-x86_64.msi"
          fi
          if [ -f dist-worker-windows.zip ]; then
            mv dist-worker-windows.zip "mbl-worker-${TAG}-windows-x86_64.zip"
          fi
          if [ -f dist-node-windows.zip ]; then
            mv dist-node-windows.zip "mbl-node-${TAG}-windows-x86_64.zip"
          fi
          if [ -f mbl-worker-linux-x86_64.tar.gz ]; then
            mv mbl-worker-linux-x86_64.tar.gz "mbl-worker-${TAG}-linux-x86_64.tar.gz"
          fi
          if [ -f mbl-node-linux-x86_64.tar.gz ]; then
            mv mbl-node-linux-x86_64.tar.gz "mbl-node-${TAG}-linux-x86_64.tar.gz"
          fi
          if [ -f mbl-worker-linux-arm64.tar.gz ]; then
            mv mbl-worker-linux-arm64.tar.gz "mbl-worker-${TAG}-linux-arm64.tar.gz"
          fi
          if [ -f mbl-node-linux-arm64.tar.gz ]; then
            mv mbl-node-linux-arm64.tar.gz "mbl-node-${TAG}-linux-arm64.tar.gz"
          fi
      - name: Generate SHA-256 Checksums
        working-directory: release-dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: release-dist/*
