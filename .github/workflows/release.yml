name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'codex/release-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching Cargo.toml (defaults to the workspace version)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUSTFLAGS: "-D warnings"
  XDG_RUNTIME_DIR: /tmp

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
      expected_tag_sha: ${{ steps.metadata.outputs.expected_tag_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify release guards
        run: python3 -m unittest discover -s .github/scripts -p test_release.py
      - name: Resolve release version and source
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/release.py prepare
      - name: Require green CI for this exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.metadata.outputs.sha }}
        run: python3 .github/scripts/release.py verify-ci

  build-deb-linux-x86_64:
    needs: prepare
    runs-on: ubuntu-24.04
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install Debian build dependencies
        run: apt-get update && apt-get install --yes --no-install-recommends build-essential ca-certificates curl git libssl-dev pkg-config python3 xz-utils zstd
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-bookworm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo build --release -p mbl-server -p mbl-worker -p mbl-node
      - run: cargo deb --no-build -p mbl-server
      - run: cargo deb --no-build -p mbl-worker
      - run: cargo deb --no-build -p mbl-node
      - name: Package standalone Linux x86_64 tarballs
        run: |
          tar -czvf target/debian/mbl-linux-x86_64.tar.gz -C target/release mbl-server mbl-worker mbl-node -C "$GITHUB_WORKSPACE/packaging/linux" README.txt -C "$GITHUB_WORKSPACE" LICENSE
          tar -czvf target/debian/mbl-worker-linux-x86_64.tar.gz -C target/release mbl-worker
          tar -czvf target/debian/mbl-node-linux-x86_64.tar.gz -C target/release mbl-node
      - name: Verify Debian binaries
        run: |
          for package in target/debian/*.deb; do
            test "$(dpkg-deb --field "$package" Version)" = "$RELEASE_VERSION-1"
            test "$(dpkg-deb --field "$package" Architecture)" = "$(dpkg --print-architecture)"
          done
          python3 .github/scripts/release.py verify-linux
          dpkg-deb --fsys-tarfile target/debian/mbl_*.deb | tar -tf - ./usr/bin/mbl-server
          dpkg-deb --fsys-tarfile target/debian/mbl-worker_*.deb | tar -tf - ./usr/bin/mbl-worker
          dpkg-deb --fsys-tarfile target/debian/mbl-node_*.deb | tar -tf - ./usr/bin/mbl-node
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-linux-x86_64
          path: |
            target/debian/*.deb
            target/debian/*.tar.gz

  build-deb-linux-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Install Debian build dependencies
        run: apt-get update && apt-get install --yes --no-install-recommends build-essential ca-certificates curl git libssl-dev pkg-config python3 xz-utils zstd
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-bookworm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo build --release -p mbl-server -p mbl-worker -p mbl-node
      - run: cargo deb --no-build -p mbl-server
      - run: cargo deb --no-build -p mbl-worker
      - run: cargo deb --no-build -p mbl-node
      - name: Package standalone Linux arm64 tarballs
        run: |
          tar -czvf target/debian/mbl-linux-arm64.tar.gz -C target/release mbl-server mbl-worker mbl-node -C "$GITHUB_WORKSPACE/packaging/linux" README.txt -C "$GITHUB_WORKSPACE" LICENSE
          tar -czvf target/debian/mbl-worker-linux-arm64.tar.gz -C target/release mbl-worker
          tar -czvf target/debian/mbl-node-linux-arm64.tar.gz -C target/release mbl-node
      - name: Verify Debian binaries
        run: |
          for package in target/debian/*.deb; do
            test "$(dpkg-deb --field "$package" Version)" = "$RELEASE_VERSION-1"
            test "$(dpkg-deb --field "$package" Architecture)" = "$(dpkg --print-architecture)"
          done
          python3 .github/scripts/release.py verify-linux
          dpkg-deb --fsys-tarfile target/debian/mbl_*.deb | tar -tf - ./usr/bin/mbl-server
          dpkg-deb --fsys-tarfile target/debian/mbl-worker_*.deb | tar -tf - ./usr/bin/mbl-worker
          dpkg-deb --fsys-tarfile target/debian/mbl-node_*.deb | tar -tf - ./usr/bin/mbl-node
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-linux-arm64
          path: |
            target/debian/*.deb
            target/debian/*.tar.gz

  build-windows-x86_64:
    needs: prepare
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mbl-server -p mbl-tv -p mbl-worker -p mbl-node
      - name: Build MSI Installer and Package Windows Zips
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item packaging\windows\README.txt staging\
          Copy-Item LICENSE staging\LICENSE.txt
          $rawTag = $env:RELEASE_TAG
          $version = $rawTag.TrimStart('v')

          # Build MSI
          & .\packaging\windows\build-msi.ps1 -Version "$version" -OutputDir "staging"

          # Copy out MSI
          Copy-Item "staging\mbl-$version-windows-x86_64.msi" "dist-windows.msi"

          # Package Full Server ZIP
          $zipName = "mbl-$rawTag-windows-x86_64.zip"
          $zipFiles = @(
            "staging\mbl-server.exe",
            "staging\mbl-tv.exe",
            "staging\mbl-worker.exe",
            "staging\mbl-node.exe",
            "staging\README.txt",
            "staging\LICENSE.txt"
          )
          Compress-Archive -Path $zipFiles -DestinationPath $zipName
          Move-Item $zipName dist-windows.zip

          # Package Standalone Worker ZIP
          $workerFiles = @(
            "staging\mbl-worker.exe",
            "packaging\windows\README-worker.txt",
            "staging\LICENSE.txt"
          )
          Compress-Archive -Path $workerFiles -DestinationPath dist-worker-windows.zip

          # Package Standalone Node ZIP
          $nodeFiles = @(
            "staging\mbl-node.exe",
            "packaging\windows\README-node.txt",
            "staging\LICENSE.txt"
          )
          Compress-Archive -Path $nodeFiles -DestinationPath dist-node-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mbl-windows-x86_64
          path: |
            dist-windows.zip
            dist-windows.msi
            dist-worker-windows.zip
            dist-node-windows.zip

  create-release:
    needs: [prepare, build-deb-linux-x86_64, build-deb-linux-arm64, build-windows-x86_64]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      EXPECTED_TAG_SHA: ${{ needs.prepare.outputs.expected_tag_sha }}
      RELEASE_NOTES: mbl-release-notes.md
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Verify all packages and generate checksums and release notes
        run: python3 .github/scripts/release.py assets
      - name: Publish the verified release tag with a lease
        run: python3 .github/scripts/release.py publish-tag
      - name: Upload all files, verify them and publish GitHub Release
        run: python3 .github/scripts/release.py publish-assets
