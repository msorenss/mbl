name: Cast receiver

# Publishes the static Cast receiver page to GitHub Pages. The Cast application registered
# with Google points at <pages-url>/cast-receiver/index.html.
#
# Runs from main: the github-pages environment only accepts the default branch, and release
# tags are created by the release workflow's GITHUB_TOKEN, which cannot trigger workflows.
on:
  push:
    branches: [main]
    paths:
      - web/cast-receiver/**
      - web/src/castReceiver.ts
      - web/src/utils/castReceiver.ts
      - web/src/utils/castProfile.ts
      - web/scripts/package-cast-receiver.mjs
      - web/vite.config.ts
      - web/package.json
      - web/pnpm-lock.yaml
      - .github/workflows/cast-receiver.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}cast-receiver/index.html
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - run: node web/scripts/package-cast-receiver.mjs _site --relative
      - run: touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
